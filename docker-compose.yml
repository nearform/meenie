# Compose v2 spec (the top-level `version:` key is intentionally omitted — it's
# obsolete in modern docker compose). Validate with: `docker compose config`.
#
# Profiles:
#   default          docker compose up --build
#   tunnel           docker compose --profile tunnel up   (adds ngrok side-car)

name: meenie

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meenie
      POSTGRES_PASSWORD: meenie
      POSTGRES_DB: meenie
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Uncomment the next two lines if you want to connect to Postgres from the
    # host (e.g. with psql). Bound to localhost-only so the database isn't
    # exposed beyond your machine.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meenie -d meenie"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      # Path-form (compose v2.24+) lets us mark .env as optional so the file
      # only needs to exist when you actually run `docker compose up`. CI and
      # `docker compose config` no longer require a real .env on disk.
      - path: .env
        required: false
    environment:
      # Inside the compose network, the database hostname is `db`. We override
      # whatever DATABASE_URL was in .env so the app talks to the compose db.
      DATABASE_URL: postgres://meenie:meenie@db:5432/meenie
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    # Apply migrations on every container start, then exec into `pnpm start`.
    entrypoint: ["./scripts/docker-entrypoint.sh"]
    restart: unless-stopped

  # Optional ngrok side-car for exposing the app over HTTPS during Slack app
  # development. Activated with: `docker compose --profile tunnel up`.
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: ["http", "app:3000"]
    depends_on:
      - app
    ports:
      # ngrok's local inspector / API. The public URL is logged on stdout —
      # see `docker compose logs ngrok`.
      - "127.0.0.1:4040:4040"
    restart: unless-stopped

volumes:
  pgdata:
    name: meenie_pgdata
